name: 'Run Twister - Intel'

on:
  pull_request:
    branches:
      - main-intel

jobs:
  run-intel-twister:
    name: 'Run Twister - Intel (main-intel PR)'
    uses: intel-innersource/os.rtos.zephyr.zephyr-intel/.github/workflows/intel_twister_reusable.yml@main-intel
    with:
      CONCURRENCY_GROUP_NAME: '${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}'
      REPO_FULL_PATH: '${{ github.event.pull_request.head.repo.full_name }}'
      REPO_REF: '${{ github.head_ref }}'
      ES_PARSE_SCRIPT: 'scripts/ci/upload_test_results_es.py'
      PR_ES_INDEX: 'zephyr-tests-staging-1'
      SCHED_ES_INDEX: 'zephyr-tests-main-intel-daily-nested'
      STATIC_REPORTS_BRANCH_NAME: 'master'
      SDK_DOCKER_VERSION: ${{ vars.ZEPHYR_DOCKER_VERSION }}
      ZEPHYR_SDK_INSTALL_DIR: '/opt/toolchains/${{ vars.ZEPHYR_SDK_VERSION }}'
    secrets:
      ZEPHYR_INTEL_TOKEN: ${{ secrets.ZEPHYR_TOKEN }}
      ELASTICSEARCH_KEY: ${{ secrets.ELASTICSEARCH_KEY }}
      IT_ELASTICSEARCH_KEY: ${{ secrets.IT_ELASTICSEARCH_KEY }}
      IGK_PRIVATE_KEY: ${{ secrets.IGK_PRIVATE_KEY }}
